specification: API Evangelist Examples
specificationVersion: '0.1'
provider: Universiti Putra Malaysia
providerId: upm
generated: '2026-09-01'
method: probed
source: >-
  Every file listed below is a verbatim, unmodified response captured from a Universiti Putra
  Malaysia host on 2026-09-01 with an unauthenticated GET. Nothing here was written by hand or
  synthesised; the `method` on each entry is `probed` for exactly that reason.
description: >-
  Captured live responses from UPM's machine-readable surfaces, kept alongside the derived
  OpenAPI documents so that the derivation can be checked against what the endpoints actually
  returned. The badVerb capture is included deliberately: it is the evidence that UPM's OAI-PMH
  endpoints answer protocol errors with HTTP 200.

examples:
