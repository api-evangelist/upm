specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Universiti Putra Malaysia
providerId: upm
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Plans
description: >-
  Universiti Putra Malaysia is a non-commercial higher-education institution; it sells no API
  product and issues no API keys. The surfaces verified on 2026-09-01 — two OAI-PMH 2.0
  repositories, the PSASIR EPrints REST/export/search interfaces, and the SAML 2.0 identity
  provider metadata — are all free and open with no registration of any kind. Administrative and
  student systems are gated by UPM-ID single sign-on and federation membership, which is an
  affiliation requirement rather than a paid plan. The June 2026 version of this file also
  referenced library and course APIs; neither was found to exist and both claims were withdrawn
  on 2026-09-01.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/upm/refs/heads/main/apis.yml
plans:
- id: upm-free-open
  name: Free / Open
  type: free
  description: Public open APIs (metadata, library, repository, course data) offered at no charge, generally for non-commercial use.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: upm-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or federation membership rather than payment.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
