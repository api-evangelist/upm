  - date: '2026-06-03'
    rating: 2
    summary: >-
      UPM has no central, publicly documented developer portal or open-data API.
      Two real, machine-readable interfaces were verified live: the PSAS
      Institutional Repository OAI-PMH 2.0 endpoint (EPrints), which returned a
      valid Identify response and six metadata formats (oai_dc, didl, mets,
      oai_bibl, rdf, uketd_dc), and the Shibboleth SAML 2.0 identity provider,
      which returned a valid SAML EntityDescriptor scoped to upm.edu.my.
      Student/staff systems (study portal, SIMS, Putra MOOC) are gated behind
      UPM-ID SSO or resolve to internal hosts and are not openly documented. No
      official UPM GitHub organization was confirmed. No endpoints were
      fabricated.
    endpoints:
