  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, with operator attribution settled
      before any artifact was saved. No vendor contract was found in this repository and none was
      removed — UPM is one of the institutions the June 2026 Figshare/Pure misattribution did not
      touch. The footprint is larger than the June review recorded, and every surface in it is
      institution-operated. Two additions: MyAgric, the Malaysian Agricultural Repository, is a
      second EPrints 3.3.16 deployment UPM runs on its own campus network with its own OAI-PMH 2.0
      endpoint, and PSASIR serves unauthenticated EPrints REST, per-item export and OpenSearch
      interfaces advertising twenty output representations, none of which had been catalogued.
      Both repository hosts resolve into UPMNET, "Universiti Putra Malaysia Campus Network". The
      Shibboleth identity provider was confirmed as UPM's own rather than a managed-IdP tenancy —
      every SSO and SLO location terminates on idf.upm.edu.my with no CNAME to an identity
      platform — and its eduGAIN registration through SIFULAN, the Malaysian Access Federation,
      was confirmed from eduGAIN's own database. Two registry memberships were evidenced: Crossref
      member 27687 holding DOI prefix 10.47836 across 5,871 DOIs, and ROR 02e91jd64. One
      correction went the other way and lowers the score: the vulnerability-disclosure page
      claimed in July 2026 does not exist. upm.edu.my soft-404s, returning HTTP 200 with site
      chrome and an empty title for every unknown path, and the claimed disclosure URL is
      indistinguishable from a nonsense path. That artifact was withdrawn. UPM still publishes no
      OpenAPI, no developer portal, no API keys, no open-data portal, no course-catalog API, no
      GitHub organisation, no llms.txt and no security.txt. Nothing was fabricated.
