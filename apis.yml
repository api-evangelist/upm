apis:
  - aid: upm:oai-pmh
    name: PSAS Institutional Repository OAI-PMH
    description: >-
      Standards-based OAI-PMH 2.0 metadata harvesting interface for the
      Universiti Putra Malaysia Institutional Repository (PSAS IR), running on
      EPrints. Supports the Identify, ListMetadataFormats, ListRecords,
      ListIdentifiers, ListSets and GetRecord verbs, and exposes records in
      oai_dc, didl, mets, oai_bibl, rdf and uketd_dc metadata formats. Confirmed
      live (HTTP 200) returning valid OAI-PMH XML.
    humanURL: http://psasir.upm.edu.my/information.html
    baseURL: http://psasir.upm.edu.my/cgi/oai2
    tags: [ OAI-PMH, Repository, EPrints, Open Access, Metadata, Research ]
    properties:
      - type: Documentation
        url: http://psasir.upm.edu.my/information.html
  - aid: upm:saml-idp
    name: UPM Shibboleth SAML 2.0 Identity Provider
    description: >-
      Federated single sign-on identity provider for Universiti Putra Malaysia,
      built on Shibboleth and publishing SAML 2.0 / SAML 1.1 metadata at its
      entityID. Used for research and education community federation
      (scope upm.edu.my). Confirmed live (HTTP 200) returning valid SAML
      EntityDescriptor metadata.
    humanURL: https://idf.upm.edu.my/idp/shibboleth
    baseURL: https://idf.upm.edu.my/idp/shibboleth
    tags: [ Identity, SSO, SAML, Shibboleth, Authentication, Federation ]
    properties:
      - type: Documentation
        url: https://idf.upm.edu.my/idp/shibboleth
