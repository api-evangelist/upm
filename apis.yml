x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated machine-readable surfaces were probed and verified live, and all four
    are recorded with derived contracts, captured examples and conformance evidence: two OAI-PMH 2.0
    repositories (PSASIR and MyAgric, both EPrints 3.3.16 inside UPM's own network allocation), the
    EPrints REST/export/OpenSearch interfaces on PSASIR, and UPM's own Shibboleth SAML 2.0 identity
    provider, which is registered in eduGAIN via SIFULAN. Two registry memberships were evidenced —
    Crossref member 27687 with prefix 10.47836, and ROR 02e91jd64. This profile is thin in artifact
    count relative to a company, and that is an accurate reading rather than a gap: UPM publishes no
    OpenAPI, runs no developer portal, issues no keys, and has no open-data portal, no course-catalog
    API and no GitHub organisation. Its administrative systems (sso., smp., putra.) answer but are
    UPM-ID gated with no public contract. Hosts checked and found absent: api., data., developer.,
    etd., reg., journals. and ejournal. under upm.edu.my do not resolve; my-gitlab.upm.edu.my appears
    in certificate transparency but does not answer on 443; idp.upm.edu.my likewise refuses
    connections. upm.edu.my serves no llms.txt, no sitemap.xml and no .well-known/security.txt, and
    it soft-404s — every unknown path returns HTTP 200 with an empty <title> and site chrome only,
    which is how a previously claimed vulnerability-disclosure page was found to be false credit and
    withdrawn in this run.
  evidence:
    - url: http://psasir.upm.edu.my/cgi/oai2?verb=Identify
      status: 200
    - url: http://psasir.upm.edu.my/cgi/oai2?verb=ListIdentifiers&metadataPrefix=oai_dc
