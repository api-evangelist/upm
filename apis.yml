description: >-
  Universiti Putra Malaysia (UPM) is a Malaysian public research university in Serdang, Selangor,
  founded as an agricultural college in 1931 and known as Universiti Pertanian Malaysia until 1997.
  UPM operates no developer portal, publishes no OpenAPI definition, issues no API keys and runs no
  self-service developer programme — and it does not need one to have a real programmable footprint.
  Four machine-readable surfaces were verified live on 2026-09-01, and all four are operated by the
  institution itself rather than by a vendor under its name. PSASIR, the institutional repository,
  runs EPrints 3.3.16 inside UPM's own campus network allocation and answers a full OAI-PMH 2.0
  harvest as well as an anonymous EPrints REST, export and OpenSearch interface offering twenty
  output representations. MyAgric, the Malaysian Agricultural Repository, is a second and distinct
  EPrints deployment UPM hosts on the same network, with its own repository identifier and its own
  OAI-PMH endpoint. UPM publishes conforming SAML 2.0 metadata for its own Shibboleth identity
  provider at idf.upm.edu.my, registered in eduGAIN through SIFULAN, the Malaysian Access
  Federation, since 2020. UPM is also a Crossref member in its own right, holding DOI prefix 10.47836
  across roughly 5,900 registered DOIs for its Pertanika and UPM Press journals. What UPM does not
  have is any interface for its student, staff and administrative systems: the Putra portal, SMP and
  the study portal sit behind UPM-ID single sign-on with no public contract, there is no open-data
  portal, no course-catalog API, no institutional GitHub organisation, and no llms.txt, sitemap or
  security.txt on the main site.
