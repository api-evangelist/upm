---
aid: upm
name: Universiti Putra Malaysia
description: >-
  Universiti Putra Malaysia (UPM) is a Malaysian public research university in
  Serdang, Selangor, formerly the Universiti Pertanian Malaysia, and ranked #148
  in the QS World University Rankings 2025. UPM has no central, publicly
  documented developer portal, but it does operate machine-readable scholarly and
  identity infrastructure: an EPrints-based institutional repository (PSAS IR)
  that exposes a standards-based OAI-PMH 2.0 metadata harvesting interface, and a
  Shibboleth SAML 2.0 identity provider used for federated single sign-on.
  Application access for students and staff (study portal, Putra portal, SIMS) is
  gated behind UPM-ID SSO and is not openly documented.
